name: Own Words entropy transfer

on:
  push:
    branches:
      - agent/own-words-context-disruption
    paths:
      - '.github/workflows/own-words-entropy-transfer.yml'

permissions:
  actions: read
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.46.3 numpy==1.26.4

      - name: Download completed cross-model benchmark artifact
        run: |
          mkdir -p /tmp/entropy-source own-words/research/entropy-transfer-results
          gh run download 31538567154 --repo "$GITHUB_REPOSITORY" --name own-words-synthid-benchmark --dir /tmp/entropy-source

      - name: Score with Pythia 14M surrogate
        run: |
          python own-words/research/entropy_efficiency.py \
            --generated /tmp/entropy-source/generated.json \
            --rewrites /tmp/entropy-source/rewrites.json \
            --csv /tmp/entropy-source/synthid_benchmark_rows.csv \
            --output-dir own-words/research/entropy-transfer-results \
            --surrogate-model EleutherAI/pythia-14m \
            --label pythia-14m

      - name: Upload transfer result
        uses: actions/upload-artifact@v4
        with:
          name: own-words-entropy-transfer
          path: own-words/research/entropy-transfer-results
          if-no-files-found: error
