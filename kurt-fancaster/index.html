<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111018">
  <title>The Adventures of Kurt Fancaster</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-page">
    <section class="game-frame" aria-labelledby="game-title">
      <div class="game-heading">
        <p class="eyebrow">A motion picture adventure</p>
        <h1 id="game-title">The Adventures of Kurt Fancaster</h1>
      </div>

      <div id="game" aria-label="The Adventures of Kurt Fancaster game canvas"></div>

      <div class="touch-controls" aria-label="Touch controls">
        <div class="d-pad" aria-label="Directional controls">
          <button type="button" class="touch-button up" data-control="up" aria-label="Move up">▲</button>
          <button type="button" class="touch-button left" data-control="left" aria-label="Move left">◀</button>
          <button type="button" class="touch-button down" data-control="down" aria-label="Move down">▼</button>
          <button type="button" class="touch-button right" data-control="right" aria-label="Move right">▶</button>
        </div>
        <div class="action-buttons">
          <button type="button" class="touch-button action" data-control="action" aria-label="Action">A</button>
          <button type="button" class="touch-button pause" data-control="pause" aria-label="Pause">Ⅱ</button>
        </div>
      </div>

      <p class="instructions">
        Keyboard: arrow keys or WASD to move, Enter or Space to select, Escape to pause.
      </p>
      <p class="project-note">
        Unofficial, noncommercial pixel-art parody. All characters, artwork, dialogue, and level designs are original.
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
