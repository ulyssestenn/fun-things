<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Own Words · Benchmark</title>
  <link rel="stylesheet" href="benchmark.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Own Words · development harness</p>
      <h1>Rewrite benchmark</h1>
      <p>Runs the local engine against known-corpus excerpts and deliberately unseen analytical prose. This measures rewrite behavior, not model attribution.</p>
      <button id="run">Run benchmark</button>
      <span id="status" aria-live="polite">Ready.</span>
    </header>
    <section id="summary" class="summary"></section>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Case</th><th>Set</th><th>Mode</th><th>Edits</th><th>Structures</th><th>Families</th><th>Depth</th><th>Target</th><th>Surface</th><th>Stop</th><th>ms</th></tr></thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </main>
  <script src="phrases.js"></script>
  <script src="words.js"></script>
  <script src="words-thorough.js"></script>
  <script src="patterns.js"></script>
  <script src="corpus-2.js"></script>
  <script src="corpus-3.js"></script>
  <script src="corpus-4.js"></script>
  <script src="corpus-5.js"></script>
  <script src="corpus-6.js"></script>
  <script src="corpus-7.js"></script>
  <script src="grammar.js"></script>
  <script src="limits.js"></script>
  <script src="metrics.js"></script>
  <script src="engine.js"></script>
  <script src="benchmark.js"></script>
</body>
</html>
